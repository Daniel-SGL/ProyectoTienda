services:
  mariadb:
    image: mariadb:11.4
    container_name: mariadb_tienda
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: TuPasswordSegura
      MARIADB_DATABASE: tienda_online
    ports:
      - "3306:3306"
    volumes:
      # Bind mounts locales
      - ./data/mysql:/var/lib/mysql
      - ./init:/docker-entrypoint-initdb.d
    networks:
      - red-tienda

  adminer:
    image: adminer:latest
    container_name: adminer_tienda
    restart: always
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: mariadb
    networks:
      - red-tienda

networks:
  red-tienda:
    driver: bridge
